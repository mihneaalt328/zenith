server:
  name: "&b&lZENITH &fSkyPvP"
  ip: "&bskypvp.zenithmc.net"
  pvp: true
  combat-tag-seconds: 10
  void-y: 0
  protect-spawn-radius: 18
  spawn-managed-by: "EssentialsX"

# ZENITH never owns /spawn. EssentialsX/EssentialsSpawn owns /setspawn and /spawn.
# Protection uses the Bukkit world spawn, which should be the Essentials spawn.

scoreboard:
  enabled: true
  title: "&b&lZENITH"
  update-seconds: 2
  lines:
    - "&8&m----------------"
    - "&fRank &8» &b{rank}"
    - "&fOnline &8» &a{online}&7/&a{max}"
    - "&fCoins &8» &e{coins}"
    - "&fKills &8» &a{kills}"
    - "&fDeaths &8» &c{deaths}"
    - "&fStreak &8» &6{streak}"
    - "&fBest &8» &6{best}"
    - "&8"
    - "&bskypvp.zenithmc.net"
    - "&8&m----------------"

tab:
  enabled: true
  team-prefix-enabled: true
  header:
    - "&8&m-------------------------------"
    - "&b&lZENITH SKYPVP"
    - "&7Welcome to the &bSkyPvP &7server!"
    - "&fOnline: &a{online}&7/&a{max}"
    - "&8"
